# Render Blueprint: one free web service in Ohio, next to the database. Values marked
# sync: false are entered once in the Render dashboard and never committed.
services:
  - type: web
    name: sandar
    runtime: docker
    dockerfilePath: ./Dockerfile.render
    plan: free
    # Same region as the Neon database (AWS us-east-2, Ohio): every page makes several queries.
    region: ohio
    healthCheckPath: /login
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_BASE_URL
        value: https://app.hellosandar.com
      - key: EMAIL_PROVIDER
        value: resend
      - key: EMAIL_FROM
        value: Sandar <noreply@hellosandar.com>
      - key: SAFETY_MODE
        value: human-review
      # The API only receives requests from the web app inside the container.
      - key: TRUST_PROXY_HOPS
        value: "0"
      - key: BFF_SHARED_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: DATA_ENCRYPTION_KEY
        sync: false
